[project]
name = "testovoe"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "pandas>=3.0.6",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "task1_text_wrap",
    "task2_lucky_ticket",
    "task3_nested_get",
    "task4_json_parse",
    "task5_pandas",
    "task6_fastapi_crud",
    "task7_fastapi_jwt",
]
